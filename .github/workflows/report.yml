name: Build and publish report

on:
  schedule:
    # Every 6 hours. Frequent enough to be current, sparse enough to stay
    # well inside public RPC rate limits.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: the project deliberately uses the standard library only.
      - name: Generate report
        run: python main.py --out public

      - name: Archive dated snapshot
        run: |
          mkdir -p public/history
          cp public/report.json "public/history/$(date -u +%Y-%m-%dT%H%M).json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
